<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="GADEH Student Portal Registration - Garissa Agro-Digital Empowerment Hub"
>

<title>GADEH Student Portal Registration</title>


<style>

/* =========================================================
   GADEH CORPORATE THEME
========================================================= */

:root{

    --red:#C00000;
    --dark-red:#8B0000;

    --black:#111111;
    --white:#FFFFFF;

    --green:#3F7D20;
    --dark-green:#285714;

    --grey:#666666;
    --light-grey:#F6F6F6;

    --border:#DCDCDC;

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}


/* =========================================================
   BODY
========================================================= */

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#FFFFFF;

    color:var(--black);

    font-size:0.75rem;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:0.8rem;

    background:var(--white);

    border-bottom:
        0.15rem solid var(--red);

}

.logo{

    width:7rem;

    height:auto;

    display:block;

}


/* =========================================================
   TITLE
========================================================= */

.title{

    text-align:center;

    margin-top:1rem;

    color:var(--red);

    font-size:1rem;

    font-weight:700;

    letter-spacing:0.03rem;

}

.title::after{

    content:"";

    display:block;

    width:3rem;

    height:0.15rem;

    margin:
        0.5rem
        auto
        0;

    background:var(--green);

    border-radius:1rem;

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

    width:100%;

    max-width:34rem;

    margin:
        0
        auto;

    padding:
        1rem;

}


/* =========================================================
   SECTION
========================================================= */

.section{

    margin-bottom:1rem;

    padding:1rem;

    background:var(--white);

    border:
        0.1rem solid var(--border);

    border-left:
        0.25rem solid var(--red);

    border-radius:0.5rem;

    box-shadow:
        0
        0.2rem
        0.8rem
        rgba(0,0,0,0.05);

}


/* =========================================================
   SECTION HEADING
========================================================= */

.section h3{

    margin-bottom:1rem;

    padding-bottom:0.4rem;

    border-bottom:
        0.1rem solid #EEEEEE;

    color:var(--red);

    font-size:0.85rem;

    font-weight:700;

}


/* =========================================================
   FORM GROUP
========================================================= */

.form-group{

    margin-bottom:0.85rem;

}


/* =========================================================
   LABEL
========================================================= */

label{

    display:block;

    margin-bottom:0.3rem;

    color:var(--black);

    font-size:0.7rem;

    font-weight:600;

}


/* =========================================================
   INPUT / SELECT / TEXTAREA
========================================================= */

input,
select,
textarea{

    width:100%;

    padding:
        0.65rem
        0.7rem;

    border:
        0.1rem solid var(--border);

    border-radius:0.35rem;

    background:var(--white);

    color:var(--black);

    font-family:inherit;

    font-size:0.75rem;

    outline:none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;

}

input:focus,
select:focus,
textarea:focus{

    border-color:var(--red);

    box-shadow:
        0
        0
        0
        0.15rem
        rgba(192,0,0,0.10);

}


textarea{

    min-height:4.5rem;

    resize:vertical;

}


/* =========================================================
   FILE INPUT
========================================================= */

input[type="file"]{

    padding:0.5rem;

    font-size:0.65rem;

}


/* =========================================================
   PASSWORD
========================================================= */

.input-wrap{

    position:relative;

}

.input-wrap input{

    padding-right:2.8rem;

}


.toggle-btn{

    position:absolute;

    right:0.6rem;

    top:50%;

    transform:translateY(-50%);

    width:1.5rem;

    height:1.5rem;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--black);

    color:var(--white);

    border-radius:50%;

    font-size:0.65rem;

    cursor:pointer;

    user-select:none;

    transition:
        background 0.2s ease,
        transform 0.2s ease;

}

.toggle-btn:hover{

    background:var(--red);

    transform:
        translateY(-50%)
        scale(1.08);

}


/* =========================================================
   PRIVACY CHECKBOX
========================================================= */

.checkbox-row{

    display:flex;

    align-items:flex-start;

    gap:0.5rem;

    margin-top:0.5rem;

}


.checkbox-row input{

    width:auto;

    margin-top:0.15rem;

    flex-shrink:0;

}


.checkbox-row label{

    margin:0;

    font-size:0.68rem;

    line-height:1.4;

    font-weight:400;

}


.checkbox-row a{

    color:var(--red);

    font-weight:700;

    text-decoration:none;

}

.checkbox-row a:hover{

    color:var(--green);

    text-decoration:underline;

}


/* =========================================================
   SUBMIT BUTTON
========================================================= */

button[type="submit"]{

    display:block;

    width:100%;

    padding:
        0.75rem
        1rem;

    margin:
        1rem
        auto
        0;

    border:none;

    border-radius:2rem;

    background:var(--red);

    color:var(--white);

    font-family:inherit;

    font-size:0.8rem;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0
        0.3rem
        0.9rem
        rgba(192,0,0,0.22);

    transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


button[type="submit"]:hover{

    background:var(--dark-red);

    transform:translateY(-0.1rem);

    box-shadow:
        0
        0.5rem
        1.2rem
        rgba(192,0,0,0.28);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:1rem;

    padding:
        1rem
        0.75rem;

    text-align:center;

    background:var(--black);

    color:var(--white);

    font-size:0.65rem;

    line-height:1.5;

    border-top:
        0.2rem solid var(--green);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:30rem){

    .logo{

        width:6rem;

    }


    .title{

        font-size:0.85rem;

        padding:
            0
            0.5rem;

    }


    .container{

        padding:
            0.75rem;

    }


    .section{

        padding:
            0.8rem;

    }


    .section h3{

        font-size:0.78rem;

    }


    label{

        font-size:0.68rem;

    }


    input,
    select,
    textarea{

        font-size:0.72rem;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <img
        src="gadeh_logo.png"
        class="logo"
        alt="GADEH Logo"
    >

</header>


<!-- =======================================================
     PAGE TITLE
======================================================= -->

<div class="title">

    GADEH STUDENT PORTAL REGISTRATION

</div>


<!-- =======================================================
     REGISTRATION CONTAINER
======================================================= -->

<div class="container">


<form
    id="studentForm"
    enctype="multipart/form-data"
>


<!-- =====================================================
     PERSONAL INFORMATION
====================================================== -->

<section class="section">

    <h3>
        Personal Information
    </h3>


    <div class="form-group">

        <label for="firstName">
            First Name
        </label>

        <input
            type="text"
            id="firstName"
            name="firstName"
            required
        >

    </div>


    <div class="form-group">

        <label for="lastName">
            Last Name
        </label>

        <input
            type="text"
            id="lastName"
            name="lastName"
            required
        >

    </div>


    <div class="form-group">

        <label for="gender">
            Gender
        </label>

        <select
            id="gender"
            name="gender"
            required
        >

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="maritalStatus">
            Marital Status
        </label>

        <select
            id="maritalStatus"
            name="maritalStatus"
            required
        >

            <option value="">
                Select Status
            </option>

            <option value="Single">
                Single
            </option>

            <option value="Married">
                Married
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="dob">
            Date of Birth
        </label>

        <input
            type="date"
            id="dob"
            name="dob"
            required
        >

    </div>


    <div class="form-group">

        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            required
        >

    </div>


    <div class="form-group">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

    </div>


    <div class="form-group">

        <label for="idNumber">
            ID Number / Passport
        </label>

        <input
            type="text"
            id="idNumber"
            name="idNumber"
            required
        >

    </div>

</section>


<!-- =====================================================
     LOCATION & ADDRESS
====================================================== -->

<section class="section">

    <h3>
        Location & Address
    </h3>


    <div class="form-group">

        <label for="county">
            County
        </label>

        <select
            id="county"
            name="county"
            required
        >

            <option value="">
                Select County
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="subCounty">
            Sub County
        </label>

        <select
            id="subCounty"
            name="subCounty"
            required
        >

            <option value="">
                Select Sub County
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="ward">
            Ward
        </label>

        <select
            id="ward"
            name="ward"
            required
        >

            <option value="">
                Select Ward
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="currentAddress">
            Current Address
        </label>

        <textarea
            id="currentAddress"
            name="currentAddress"
            required
        ></textarea>

    </div>


    <div class="form-group">

        <label for="permanentAddress">
            Permanent Address
        </label>

        <textarea
            id="permanentAddress"
            name="permanentAddress"
            required
        ></textarea>

    </div>

</section>


<!-- =====================================================
     COURSE DETAILS
====================================================== -->

<section class="section">

    <h3>
        Course Details
    </h3>


    <div class="form-group">

        <label for="course">
            Course Name
        </label>

        <input
            type="text"
            id="course"
            name="course"
            required
        >

    </div>


    <div class="form-group">

        <label for="intake">
            Intake
        </label>

        <select
            id="intake"
            name="intake"
            required
        >

            <option value="">
                Select Intake
            </option>

            <option value="January">
                January
            </option>

            <option value="May">
                May
            </option>

            <option value="September">
                September
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="mode">
            Study Mode
        </label>

        <select
            id="mode"
            name="mode"
            required
        >

            <option value="">
                Select Mode
            </option>

            <option value="Full Time">
                Full Time
            </option>

            <option value="Part Time">
                Part Time
            </option>

            <option value="Online">
                Online
            </option>

        </select>

    </div>

</section>


<!-- =====================================================
     EMERGENCY CONTACT
====================================================== -->

<section class="section">

    <h3>
        Emergency Contact
    </h3>


    <div class="form-group">

        <label for="emergencyName">
            Full Name
        </label>

        <input
            type="text"
            id="emergencyName"
            name="emergencyName"
            required
        >

    </div>


    <div class="form-group">

        <label for="emergencyPhone">
            Phone Number
        </label>

        <input
            type="tel"
            id="emergencyPhone"
            name="emergencyPhone"
            required
        >

    </div>


    <div class="form-group">

        <label for="relationship">
            Relationship
        </label>

        <select
            id="relationship"
            name="relationship"
            required
        >

            <option value="">
                Select Relationship
            </option>

            <option value="Parent">
                Parent
            </option>

            <option value="Sibling">
                Sibling
            </option>

            <option value="Guardian">
                Guardian
            </option>

            <option value="Friend">
                Friend
            </option>

        </select>

    </div>


    <div class="form-group">

        <label for="profilePhoto">
            Profile Photo
        </label>

        <input
            type="file"
            id="profilePhoto"
            name="profilePhoto"
            accept=".jpg,.jpeg,.png"
            required
        >

    </div>

</section>


<!-- =====================================================
     ACCOUNT SECURITY
====================================================== -->

<section class="section">

    <h3>
        Account Security
    </h3>


    <div class="form-group">

        <label for="password">
            Password
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                required
            >

            <div
                class="toggle-btn"
                onclick="togglePassword('password', this)"
                title="Show or hide password"
            >
                ●
            </div>

        </div>

    </div>


    <div class="form-group">

        <label for="confirmPassword">
            Confirm Password
        </label>

        <div class="input-wrap">

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                required
            >

            <div
                class="toggle-btn"
                onclick="togglePassword('confirmPassword', this)"
                title="Show or hide password"
            >
                ●
            </div>

        </div>

    </div>


    <div class="checkbox-row">

        <input
            type="checkbox"
            id="privacy"
            name="privacy"
            required
        >

        <label for="privacy">

            I agree to the GADEH
            Privacy Policy and Terms & Conditions.

        </label>

    </div>

</section>


<!-- =====================================================
     SUBMIT
====================================================== -->

<button
    type="submit"
>
    Submit Registration
</button>


</form>

</div>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

    © GADEH ICT TEAM. All rights reserved.

</footer>


<!-- =======================================================
     PASSWORD SCRIPT
======================================================= -->

<script>

function togglePassword(id, button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "○";

    }else{

        input.type = "password";

        button.textContent = "●";

    }

}


/* =========================================================
   PASSWORD MATCH VALIDATION
========================================================= */

document
    .getElementById("studentForm")
    .addEventListener("submit", function(event){

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if(password !== confirmPassword){

            event.preventDefault();

            alert(
                "Passwords do not match. Please check and try again."
            );

        }

    });

</script>


<!-- =======================================================
     GADEH REGISTRATION JAVASCRIPT
======================================================= -->

<script
    type="module"
    src="signup.js">
</script>


</body>

</html>
